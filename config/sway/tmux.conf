# tmux-like config for sway

set $prefix $mod+Space

input "type:keyboard" {
  xkb_layout us
  xkb_variant ,nodeadkeys
  xkb_options caps:swapescape
}

# action mode (like tmux prefix mode) ------------------------------------

bindsym $prefix mode "action"

mode "action" {
  bindsym d kill; mode "default"
  bindsym colon mode "default"; exec $menu
  bindsym semicolon mode "default"; exec $term;
  bindsym r mode "resize"
  bindsym s mode "split"
  bindsym Shift+m mode "mouse"
  
  bindsym c mode "default"; reload
  bindsym Shift+e exit  

  bindsym f mode "default"; fullscreen
  bindsym a mode "default"; focus parent
  bindsym m mode "default"; bar mode toggle

  # media control
  bindsym p       mode "default"; exec playerctl play-pause
  bindsym n       mode "default"; exec playerctl next
  bindsym Shift+n mode "default"; exec playerctl previous

  # wallpaper
  bindsym w mode "default"; exec set-wallpaper

  # Cycle workspaces
  bindsym Tab workspace next; mode "default"
  bindsym Shift+Tab workspace prev; mode "default"
  # Switch to workspace
  bindsym 1 workspace number 1; mode "default"
  bindsym 2 workspace number 2; mode "default"
  bindsym 3 workspace number 3; mode "default"
  bindsym 4 workspace number 4; mode "default"
  bindsym 5 workspace number 5; mode "default"
  bindsym 6 workspace number 6; mode "default"
  bindsym 7 workspace number 7; mode "default"
  bindsym 8 workspace number 8; mode "default"
  bindsym 9 workspace number 9; mode "default"
  bindsym 0 workspace number 10; mode "default"
  # Move focused container to workspace
  bindsym Shift+1 move container to workspace number 1; mode "default"
  bindsym Shift+2 move container to workspace number 2; mode "default"
  bindsym Shift+3 move container to workspace number 3; mode "default"
  bindsym Shift+4 move container to workspace number 4; mode "default"
  bindsym Shift+5 move container to workspace number 5; mode "default"
  bindsym Shift+6 move container to workspace number 6; mode "default"
  bindsym Shift+7 move container to workspace number 7; mode "default"
  bindsym Shift+8 move container to workspace number 8; mode "default"
  bindsym Shift+9 move container to workspace number 9; mode "default"
  bindsym Shift+0 move container to workspace number 10; mode "default"

  # scratchpad/floating area
  bindsym Shift+space floating toggle; mode "default"
  bindsym space focus mode_toggle; mode "default"
  bindsym Shift+minus move scratchpad; mode "default"
  bindsym minus scratchpad show; mode "default"

  # move around
  bindsym $left focus left; mode "default"
  bindsym $down focus down; mode "default"
  bindsym $up focus up; mode "default"
  bindsym $right focus right; mode "default"
  # Move the focused window with the same, but add Shift
  bindsym Shift+$left move left; mode "default"
  bindsym Shift+$down move down; mode "default"
  bindsym Shift+$up move up; mode "default"
  bindsym Shift+$right move right; mode "default"

  # Return to default mode
  bindsym Return mode "default"
  bindsym Escape mode "default"
}

# edit-desktop mode (for moving stuff around) ----------------------------

bindsym ctrl+$prefix mode "edit-desktop"

mode "edit-desktop" {
  bindsym d kill
  bindsym colon mode "default"; exec $menu; mode "edit-desktop"
  bindsym r mode "resize"
  bindsym s mode "split"
  bindsym Shift+m mode "mouse"
  
  # fullscreen
  bindsym f fullscreen
  # parent
  bindsym a focus parent
  # toggle bar
  bindsym m bar mode toggle

  # wallpaper
  bindsym w exec set-wallpaper

  # Cycle workspaces
  bindsym Tab workspace next
  bindsym Shift+Tab workspace prev
  # Switch to workspace
  bindsym 1 workspace number 1
  bindsym 2 workspace number 2
  bindsym 3 workspace number 3
  bindsym 4 workspace number 4
  bindsym 5 workspace number 5
  bindsym 6 workspace number 6
  bindsym 7 workspace number 7
  bindsym 8 workspace number 8
  bindsym 9 workspace number 9
  bindsym 0 workspace number 10
  # Move focused container to workspace
  bindsym Shift+1 move container to workspace number 1; workspace 1
  bindsym Shift+2 move container to workspace number 2; workspace 2
  bindsym Shift+3 move container to workspace number 3; workspace 3
  bindsym Shift+4 move container to workspace number 4; workspace 4
  bindsym Shift+5 move container to workspace number 5; workspace 5
  bindsym Shift+6 move container to workspace number 6; workspace 6
  bindsym Shift+7 move container to workspace number 7; workspace 7
  bindsym Shift+8 move container to workspace number 8; workspace 8
  bindsym Shift+9 move container to workspace number 9; workspace 9
  bindsym Shift+0 move container to workspace number 10; workspace 0

  # Switch the current container between different layout styles
  bindsym t layout stacking
  bindsym y layout tabbed
  bindsym e layout toggle split

  # scratchpad/floating area
  bindsym Shift+space floating toggle
  bindsym space focus mode_toggle
  bindsym Shift+minus move scratchpad
  bindsym minus scratchpad show

  # move around
  bindsym $left focus left
  bindsym $down focus down
  bindsym $up focus up
  bindsym $right focus right
  # Move the focused window with the same, but add Shift
  bindsym Shift+$left move left
  bindsym Shift+$down move down
  bindsym Shift+$up move up
  bindsym Shift+$right move right

  # Return to default mode
  bindsym Return mode "default"
  bindsym Escape mode "default"
}

# misc -------------------------------------------------------------------

floating_modifier $mod normal
default_border pixel

# Split mode (as hack for key sequence)
mode "split" {
    bindsym h splith; mode "default"
    bindsym v splitv; mode "default"

    # Return to default mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

# Resizing containers:
mode "resize" {
    # left will shrink the containers width
    # right will grow the containers width
    # up will shrink the containers height
    # down will grow the containers height
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px

    # Ditto, with arrow keys
    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px

    # Return to default mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

# Mouse mode (https://www.reddit.com/r/swaywm/comments/1fryie4/use_the_numeric_keyboard_keys_as_mouse_in_wayland/)
mode "mouse" {
    bindsym Left seat - cursor move -10 0
    bindsym Down seat - cursor move 0 +10
    bindsym Up seat - cursor move 0 -10
    bindsym Right seat - cursor move +10 0

    bindsym Shift+Left seat - cursor move -50 0
    bindsym Shift+Down seat - cursor move 0 +50
    bindsym Shift+Up seat - cursor move 0 -50
    bindsym Shift+Right seat - cursor move +50 0

    bindsym Escape mode "default"

    # Left click
    bindsym --no-repeat Return seat - cursor press button1
    bindsym --release Return seat - cursor release button1
    #bindsym Return exec 'swaymsg seat - cursor press button1 && swaymsg seat - cursor release button1'

    # Right click
    bindsym --no-repeat Shift+Return seat - cursor press button3
    bindsym --release Shift+Return seat - cursor release button3
    #bindsym Shift+Return exec 'swaymsg seat - cursor press button3 && swaymsg seat - cursor release button3'
}

# window switching shortcuts
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
